{{- $nginx := (include "nginx.fullname" .Subcharts.nginx) -}}

server {
    listen       {{ .Values.nginx.service.port }};
    server_name  {{ (mustFirst .Values.nginx.ingress.hosts).host }} {{ $nginx }}.{{ .Release.Namespace }}.svc.cluster.local {{ $nginx }};

    charset     utf-8;

    client_max_body_size 20M;
    client_body_buffer_size 256K;
    large_client_header_buffers 4 64k;
    proxy_read_timeout 600s;

    # compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.1;
    gzip_disable "MSIE [1-6]\.";
    gzip_buffers 16 8k;
    gzip_min_length 1100;
    gzip_comp_level 6;
    gzip_types
            text/css
            text/javascript
            text/xml
            text/plain
            application/xml
            application/xml+rss
            application/javascript
            application/x-javascript
            application/json;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;

    location = /50x.html { 
        root   /usr/share/nginx/html;
    }

    # master
    {{- $masterContext := .Values.master.config.contextPath | default "/geoserver"}}
    location {{ $masterContext }} {
        proxy_pass http://{{ include "geoserver.master.fullname" . }}:{{ .Values.master.service.port | default "8080" | toString }}{{ $masterContext }};

        proxy_intercept_errors on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # slave
    {{- if .Values.cluster.enabled }}
    {{- $slaveContext := .Values.slave.config.contextPath | default "/geoserver" }}
    
    {{- if eq $masterContext $slaveContext }}
    {{- fail "O contexto do master não pode ser igual ao slave" }}
    {{- end }}

    # Set all requests to slave's REST API as not found
    location {{ $slaveContext }}/rest {
        return 404;
    }

    location {{ $slaveContext }} {
        proxy_pass http://{{ include "geoserver.slave.fullname" . }}:{{ .Values.slave.service.port | default "8080" | toString }}{{ $slaveContext }};

        proxy_intercept_errors on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    {{- end }}
}