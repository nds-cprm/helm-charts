{{- $host := .Values.ingress.host.name -}}
{{- $path := include "geoserver.master.contextPath" . -}}
{{- $proxyBaseURL := include "geoserver.master.proxyBaseURL" . -}}
{{- $brokerURL := include "geoserver.cluster.brokerURL" . -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "geoserver.master.fullname" . }}
data:
{{- with .Values.master }}            
  {{- if .config.jvm.JAVA_OPTS }}
  JAVA_OPTS: {{ .config.jvm.JAVA_OPTS | quote }}
  {{- end }}
  {{- if .config.jvm.CATALINA_OPTS }}
  CATALINA_OPTS: {{ .config.jvm.CATALINA_OPTS | quote }} 
  {{- end }}
  {{- if .config.jvm.GEOSERVER_OPTS }} 
  GEOSERVER_OPTS: {{ .config.jvm.GEOSERVER_OPTS | quote }}
  {{- end }}
    # Proxy Base URL (Only if ingress enabled)
  {{- if $.Values.ingress.enabled }}
  PROXY_BASE_URL: {{ $proxyBaseURL }}
  {{- end }}
  # Change geoserver context path
  GEOSERVER_CONTEXT_PATH: {{ $path }}
  {{- if .pvc.enabled }}
  GEOSERVER_DATA_DIR: {{ .pvc.mountPath | quote }} 
  {{- end }}
  {{- if .config.gwc.cacheDir }}
  GEOWEBCACHE_CACHE_DIR: {{ .config.gwc.cacheDir }}
  {{- end }}
  # disable console
  GEOSERVER_CONSOLE_DISABLED: {{ .config.console.disabled | toString | lower | quote  }}
  # CSRF
  GEOSERVER_CSRF_DISABLED: {{ .config.csrf.disabled | toString | lower | quote  }}
  {{- if not .config.csrf.disabled }}
  {{- $csrfWhiteList := ternary list .config.csrf.whitelist (empty .config.csrf.whitelist) }}
  {{- if $.Values.ingress.enabled }}
  {{- $csrfWhiteList := prepend .config.csrf.whitelist $host }}
  {{- end }}
  GEOSERVER_CSRF_WHITELIST: {{ join "," $csrfWhiteList }}
  {{- end }}
  # Marlin Renderer
  GEOSERVER_DISABLE_MARLIN: {{ .config.marlinRenderer.disabled | toString | lower | quote  }} 
  {{- if .config.appSchema.propertiesFile }} 
  GEOSERVER_APPSCHEMA_PROPERTIES_FILE: {{ .config.appSchema.propertiesFile }}
  {{- end }}
  # CORS
  GEOSERVER_CORS_ALLOWED_ORIGINS: {{ ( join "," .config.cors.allowedOrigins ) | quote }}  
{{- end -}}
{{- if .Values.cluster.enabled }}
  # cluster
  CLUSTER_CONFIG_TOGGLE_MASTER: "true"
  CLUSTER_CONFIG_TOGGLE_SLAVE: "false"
  CLUSTER_CONFIG_READONLY: "disabled"  # Master is always disabled
  CLUSTER_CONFIG_EMBEDDED_BROKER: {{ (ternary "enabled" "disabled" .Values.cluster.embeddedBroker) }}
  {{- if not .Values.cluster.embeddedBroker }}
  CLUSTER_CONFIG_BROKER_URL: {{ $brokerURL | quote }} 
  {{- end }}
  CLUSTER_CONFIG_DURABLE: {{ .Values.cluster.durable | quote }}
  CLUSTER_CONFIG_CONNECTION: "disabled"  # Master is always disabled
{{- end }}
